name: weekly-trend

# 매주 월요일 08:40 KST(=일 23:40 UTC). 매일 쌓인 통계 스냅샷을 집계한다(수집 없음).
on:
  schedule:
    - cron: "40 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-trend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Claude Code CLI
        run: curl -fsSL https://claude.ai/install.sh | bash
      - name: Build weekly trend
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python src/weekly.py
      - name: Commit weekly report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/weekly.html
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "chore: weekly trend $(date -u +%F)"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "push 성공 (시도 $i)"; exit 0
            fi
            echo "push 경쟁 감지 — 재시도 $i/3"; sleep 5
          done
          echo "push 3회 실패"; exit 1
