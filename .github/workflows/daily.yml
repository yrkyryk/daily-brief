name: daily-brief

# 하루 3회 (KST). 첫 발송=전체 브리핑, 이후=새로 뜬 소식만(증분).
# GitHub Actions cron 은 UTC 기준이며 부하 시 몇 분~수십 분 지연될 수 있다(알림용이라 무방).
on:
  schedule:
    - cron: "30 23 * * *"   # 08:30 KST (전날 23:30 UTC)
    - cron: "7 4 * * *"     # 13:07 KST (04:07 UTC) — 정각 혼잡 회피
    - cron: "7 9 * * *"     # 18:07 KST (09:07 UTC) — 정각 혼잡 회피
  workflow_dispatch:

permissions:
  contents: write   # 리포트 커밋 + GitHub Pages(docs/) 배포
  issues: write     # 실패 시 이슈 자동 생성

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      # 그날 첫 실행이면 전체 브리핑(AI), 아니면 증분 헤드라인(AI 생략).
      # 판정 기준: data/seen_{날짜}.json 존재 여부(첫 발송 시 telegram 이 생성·커밋).
      - name: Detect first run of day (KST)
        id: slot
        run: |
          DAY=$(TZ=Asia/Seoul date +%F)
          if [ -f "data/seen_${DAY}.json" ]; then
            echo "first=false" >> "$GITHUB_OUTPUT"
            echo "오늘 이미 브리핑 발송됨 → 증분(헤드라인) 모드, AI 생략"
          else
            echo "first=true" >> "$GITHUB_OUTPUT"
            echo "오늘 첫 실행 → 전체 브리핑 모드(AI)"
          fi

      - name: Collect + rule filter
        run: python src/collect.py

      - name: Install Claude Code CLI
        if: steps.slot.outputs.first == 'true'
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Generate report (AI summary via OAuth)
        if: steps.slot.outputs.first == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python src/report.py

      # 텔레그램 발송(선택) — 시크릿 없으면 스크립트가 스스로 스킵한다.
      # 첫 실행=전체 브리핑, 이후=새 헤드라인만(스크립트가 seen 으로 자동 판단).
      # 발송 실패가 배포를 막지 않도록 continue-on-error.
      - name: Notify via Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # vars.SITE_URL 이 있으면 그걸, 없으면 이 레포의 GitHub Pages 주소를 자동 사용
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python src/telegram_notify.py

      - name: Commit report (docs/ → GitHub Pages)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: daily brief $(date -u +%F)"
          # 하루 여러 번 실행되므로 원격이 앞서 있을 수 있다. rebase 후 재시도.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "push 성공 (시도 $i)"; exit 0
            fi
            echo "push 경쟁 감지 — 재시도 $i/3"; sleep 5
          done
          echo "push 3회 실패"; exit 1

      # 실패 시 GitHub Issue 자동 생성 (계획서 V3 실패 처리)
      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const day = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `daily-brief 실패 — ${day}`,
              body: [
                `자동 실행이 실패했습니다.`,
                ``,
                `- 워크플로우 실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `- 흔한 원인: RSS 소스 차단/구조 변경(수집 게이트 exit 1), OAuth 토큰 만료(\`claude setup-token\` 재발급 후 시크릿 갱신).`,
                `- 다음 실행은 빠진 날짜부터 다시 수집합니다.`,
              ].join("\n"),
              labels: ["daily-brief", "automation-failure"],
            });
