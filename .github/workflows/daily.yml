name: daily-brief

# 하루 3회 (KST). 첫 발송=전체 브리핑, 이후=새로 뜬 소식만(증분).
# GitHub Actions cron 은 UTC 기준이며 부하 시 몇 분 지연될 수 있다(알림용이라 무방).
on:
  schedule:
    - cron: "0 22 * * *"    # 07:00 KST (전날 22:00 UTC)
    - cron: "30 3 * * *"    # 12:30 KST (03:30 UTC)
    - cron: "0 9 * * *"     # 18:00 KST (09:00 UTC)
  workflow_dispatch:

permissions:
  contents: write   # 리포트 커밋 + GitHub Pages(docs/) 배포
  issues: write     # 실패 시 이슈 자동 생성

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Collect + rule filter
        run: python src/collect.py

      - name: Install Claude Code CLI
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Generate report (AI summary via OAuth)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python src/report.py

      # 텔레그램 발송(선택) — 시크릿 없으면 스크립트가 스스로 스킵한다.
      # 발송 실패가 리포트 배포를 막지 않도록 continue-on-error.
      - name: Notify via Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python src/telegram_notify.py

      - name: Commit report (docs/ → GitHub Pages)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: daily brief $(date -u +%F)"
            git push
          fi

      # 실패 시 GitHub Issue 자동 생성 (계획서 V3 실패 처리)
      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const day = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `daily-brief 실패 — ${day}`,
              body: [
                `자동 실행이 실패했습니다.`,
                ``,
                `- 워크플로우 실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `- 흔한 원인: RSS 소스 차단/구조 변경(수집 게이트 exit 1), OAuth 토큰 만료(\`claude setup-token\` 재발급 후 시크릿 갱신).`,
                `- 다음 실행은 빠진 날짜부터 다시 수집합니다.`,
              ].join("\n"),
              labels: ["daily-brief", "automation-failure"],
            });
