name: daily-brief

# 발송 시각은 "외부 스케줄러"가 workflow_dispatch 로 호출해 결정한다.
#   08:30 / 13:00 / 18:00 KST — 설정 방법은 SCHEDULING.md 참조.
#
# GitHub 의 schedule(cron) 을 발송 시각으로 쓰지 않는 이유:
#   이 레포 실행 이력 65건에서 러너 대기는 전부 0초인데도 트리거 생성 자체가
#   상시 지연된다(아침 +2h, 점심/저녁 +5h). 레포 안에서 고칠 수 없는 GitHub 쪽 특성이다.
#   반면 workflow_dispatch 는 테스트한 24건 전부 대기 0초로 즉시 실행됐다.
#
# 아래 schedule 2개는 "안전망"이다. 외부 스케줄러가 죽은 날에만 동작하도록
# gate 잡이 막는다(정상 운영 중엔 조용히 스킵 → 중복 발송 0).
# 실제 도착 시각 기준으로 골랐다(측정값: 23:30 UTC→10:30 KST, 04:07 UTC→18:15 KST).
on:
  schedule:
    - cron: "30 23 * * *"   # 실제 10:30 KST 전후 — 안전망 1회차(전체 브리핑)
    - cron: "7 4 * * *"     # 실제 18:15 KST 전후 — 안전망 2회차(새 헤드라인)
  workflow_dispatch:

permissions:
  contents: write   # 리포트 커밋 + GitHub Pages(docs/) 배포
  issues: write     # 실패 시 이슈 자동 생성

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  # 발송 모드 판정 + 안전망 cron 의 중복 발송 차단.
  # slot.py 는 표준 라이브러리만 쓰므로 여기선 requirements 설치가 필요 없다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.slot.outputs.mode }}
      proceed: ${{ steps.slot.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 모드 판정은 slot.py 단일 지점에 위임(시각 기준).
      #   brief    = 아침(KST 08시~) + 그날 요약 미발송 → 전체 브리핑(AI)
      #   headlines= 그 외(요약 이미 발송 / 자정~새벽 구간) → 증분 헤드라인(AI 생략)
      - name: Decide send mode (KST)
        id: slot
        run: |
          MODE=$(python src/slot.py)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # 안전망 cron(schedule)은 "최근 발송이 없을 때"만 진행한다.
          # 외부 스케줄러가 살아 있으면 방금 발송했을 테니 여기서 끝낸다(중복 0).
          # 판정 기준은 slot.py 단일 지점(마지막 발송 이후 SEND_GAP_HOURS).
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(python src/slot.py --safety-check)" = "suppress" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "안전망 cron — 최근 발송이 있어 중단(외부 스케줄러 정상)."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "발송 진행 — 모드: $MODE (트리거: $GITHUB_EVENT_NAME)"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Collect + rule filter
        run: python src/collect.py

      - name: Install Claude Code CLI
        if: needs.gate.outputs.mode == 'brief'
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Generate report (AI summary via OAuth)
        if: needs.gate.outputs.mode == 'brief'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python src/report.py

      # 텔레그램 발송(선택) — 시크릿 없으면 스크립트가 스스로 스킵한다.
      # 모드는 telegram_notify.py 가 slot.py 로 다시 판정한다(gate 와 동일 결과).
      # 발송 실패가 배포를 막지 않도록 continue-on-error.
      - name: Notify via Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # vars.SITE_URL 이 있으면 그걸, 없으면 이 레포의 GitHub Pages 주소를 자동 사용
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python src/telegram_notify.py

      - name: Commit report (docs/ → GitHub Pages)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: daily brief $(date -u +%F)"
          # 하루 여러 번 실행되므로 원격이 앞서 있을 수 있다. rebase 후 재시도.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "push 성공 (시도 $i)"; exit 0
            fi
            echo "push 경쟁 감지 — 재시도 $i/3"; sleep 5
          done
          echo "push 3회 실패"; exit 1

      # 실패 시 GitHub Issue 자동 생성 (계획서 V3 실패 처리)
      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const day = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `daily-brief 실패 — ${day}`,
              body: [
                `자동 실행이 실패했습니다.`,
                ``,
                `- 워크플로우 실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `- 흔한 원인: RSS 소스 차단/구조 변경(수집 게이트 exit 1), OAuth 토큰 만료(\`claude setup-token\` 재발급 후 시크릿 갱신).`,
                `- 외부 스케줄러가 멈췄는지도 확인: SCHEDULING.md`,
                `- 다음 실행은 빠진 날짜부터 다시 수집합니다.`,
              ].join("\n"),
              labels: ["daily-brief", "automation-failure"],
            });
